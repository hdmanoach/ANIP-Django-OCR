<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANIP Challenge – Reconnaissance Faciale & OCR</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
            color: #343a40;
        }

        header {
            background: linear-gradient(90deg, #4f46e5, #6d28d9);
            color: white;
            padding: 40px 0;
            text-align: center;
        }

        .card {
            transition: 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
        }

        .btn-custom {
            background-color: #4f46e5;
            color: white;
        }

        .btn-custom:hover {
            background-color: #3730a3;
        }

        .card-body .desc {
            font-size: 0.95rem;
            color: #6c757d;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1 class="fw-bold">Challenge ANIP – Reconnaissance Faciale & OCR</h1>
    </header>

    <main class="container my-5">

        <div class="d-flex flex-column flex-md-row justify-content-between gap-4">

            <!-- OCR -->
            <div class="card flex-fill text-center">
                <div class="card-body d-flex flex-column justify-content-between">
                    <form action="{% url 'ocr_view' %}" method="get">
                        <button type="submit" class="btn btn-custom mb-3"> Extraire du texte</button>
                    </form>
                    <p class="desc">
                        Extraire automatiquement du texte à partir d’images de documents d’identité.
                    </p>
                </div>
            </div>

            <!-- Comparaison de visages -->
            <div class="card flex-fill text-center">
                <div class="card-body d-flex flex-column justify-content-between">
                    <form action="{% url 'compare_view' %}" method="get">
                        <button type="submit" class="btn btn-custom mb-3"> Comparer des visages</button>
                    </form>
                    <p class="desc">
                        Vérifiez si deux photos représentent la même personne grâce à l’IA.
                    </p>
                </div>
            </div>

            <!-- Estimation d'âge -->
            <div class="card flex-fill text-center">
                <div class="card-body d-flex flex-column justify-content-between">
                    <form action="{% url 'age_view' %}" method="get">
                        <button type="submit" class="btn btn-custom mb-3"> Estimer l'âge</button>
                    </form>
                    <p class="desc">
                        Estimez l’âge d’une personne à partir de son image faciale.
                    </p>
                </div>
            </div>

        </div>
    </main>

    <!-- Bootstrap JS (si nécessaire) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
